server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy (Phase 3 XSS pass) — this is what actually
    # protects the rendered app page: the browser only enforces the CSP
    # from the response that delivered the HTML document, which is this
    # server, not the API (helmet's CSP on backend/src/app.js only covers
    # the API's own JSON responses). See docs/security-decisions.md for
    # exactly what this does and doesn't block.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # All routes fall through to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
